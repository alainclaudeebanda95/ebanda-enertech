<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, precise, credible — an engineer who builds working AI.
   IDEA: an inspection instrument — the page reads like a scan readout.
   PICTURE: a detection frame scanning an undercarriage, boxes locking on.
   COLOUR and TYPE: aluminium, black, one orange pointer; Geist 500 + Geist.
   LAYOUT: hero readout with the scan, then long bands: projects, services, contact. */
:root{color-scheme:light dark;
  --bg:light-dark(#e9eaec,#141517);--panel:light-dark(#f6f6f7,#1d1f22);
  --ink:light-dark(#101112,#ecedef);--mute:light-dark(#55585e,#a3a7ae);
  --line:light-dark(#c9cbcf,#33363b);--acc:#ff4f00;--acc-ink:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Geist,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(40px,6vw,88px) max(5vw,16px);border-top:1px solid var(--line)}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,5vw,52px);line-height:1.05;letter-spacing:-.02em}
h2{font-size:clamp(28px,3.4vw,38px);line-height:1.1;letter-spacing:-.01em;margin-bottom:12px}
h3{font-size:19px;line-height:1.25}
p{margin:0 0 12px;max-width:68ch}
.lead{color:var(--mute);font-size:17px}
/* nav */
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:20px;padding:12px max(5vw,16px);flex-wrap:wrap}
.logo{font-weight:600;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo{font-size:17px;gap:10px}.logo .lt{font-weight:400;color:var(--mute)}
nav ul{display:flex;gap:18px;list-style:none;margin:0 0 0 auto;padding:0;flex-wrap:wrap}
nav ul a{text-decoration:none;color:var(--mute);font-size:15px;padding:10px 0;display:inline-block}
nav ul a:hover{color:var(--ink)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:center;padding:clamp(32px,5vw,72px) max(5vw,16px)}
.role{color:var(--mute);font-size:17px;margin:14px 0 22px}
.role b{color:var(--ink);font-weight:500}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:8px;text-decoration:none;font-weight:500;border:1px solid var(--ink)}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:focus-visible,nav a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.scan{position:relative;aspect-ratio:4/3;background:#101113;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.scan svg{position:absolute;inset:0;width:100%;height:100%}
.sweep{animation:sweep 4.5s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(520px)}}
@media(prefers-reduced-motion:reduce){.sweep{animation:none}}
.readout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:28px}
.readout div{background:var(--panel);padding:12px 14px}
.readout b{display:block;font-size:15px;font-weight:500}
.readout span{font-size:13px;color:var(--mute)}
/* about */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px)}
.facts{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.facts li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.facts span{color:var(--mute)}
.mv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin:40px 0 32px}
.mv>div{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:10px;padding:20px}
.mv h3{margin-bottom:8px}.mv p{margin:0;color:var(--mute)}
.sub{margin:28px 0 10px}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.values div{background:var(--panel);padding:16px 18px}
.values b{display:block;font-weight:500;margin-bottom:4px}
.values span{color:var(--mute);font-size:15px}
footer p{max-width:90ch;margin:0 0 6px}
.journey{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.journey li{position:relative;padding:0 0 18px 22px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 16px}
.journey li::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
.journey b{font-weight:500;white-space:nowrap}.journey span{color:var(--mute)}
@media(max-width:600px){.journey li{grid-template-columns:minmax(0,1fr)}.lang{margin-left:auto}nav ul{order:3;flex-basis:100%}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-top:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px}
.card p{color:var(--mute);margin:0;font-size:15.5px}
.card dl{margin:4px 0 0;font-size:14.5px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.card dt{color:var(--mute)}
.card dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.tags span{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.flag{font-size:13px;color:var(--acc);font-weight:500}
.price{font-size:15px;font-weight:500}
/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:24px;margin-top:24px}
.skills h3{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.skills h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--acc)}
.skills ul{list-style:none;padding:0;margin:0;color:var(--mute)}
.skills li{padding:3px 0}
/* contact */
.contact{background:#101113;color:#ecedef;border-top:0}
.contact .lead{color:#a3a7ae}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:24px}
.links a{display:block;border:1px solid #33363b;border-radius:10px;padding:16px;text-decoration:none;min-height:44px}
.links a:hover{border-color:var(--acc)}
.links small{display:block;color:#a3a7ae;font-size:13px}
.note{font-size:13px;color:#a3a7ae;margin-top:20px}
footer{background:#101113;color:#a3a7ae;font-size:13px;padding:20px max(5vw,16px);border-top:1px solid #33363b}
@media(max-width:860px){.hero,.two{grid-template-columns:minmax(0,1fr)}.readout{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){nav ul{margin-left:0;gap:14px}}
.journey li{grid-template-columns:150px minmax(0,1fr)}
.lang{margin-left:8px;min-width:44px;min-height:40px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.lang:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.demo .ticks{list-style:none;padding:0;margin:0 0 20px}
.demo .ticks li{padding:6px 0 6px 28px;position:relative}
.demo .ticks li::before{content:"";position:absolute;left:0;top:13px;width:14px;height:8px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg)}
.small{font-size:13px;color:var(--mute);margin-top:12px}
.phone{justify-self:center;width:min(100%,340px);background:#101113;border-radius:28px;padding:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.ph-head{background:#1f3a5f;color:#fff;border-radius:18px 18px 0 0;padding:12px 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.ph-head i{width:9px;height:9px;border-radius:50%;background:#4ade80}
.ph-body{background:#f8f9fa;border-radius:0 0 18px 18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.pm{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;color:#111827}
.pm.bot{background:#fff;border:1px solid #d9dce1;align-self:flex-start}
.pm.user{background:#1f3a5f;color:#fff;align-self:flex-end}
@media(max-width:600px){.journey li{grid-template-columns:minmax(0,1fr)}.lang{margin-left:auto}nav ul{order:3;flex-basis:100%}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;margin:24px 0 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.stat h3{margin-bottom:8px}.stat .fix{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}.stat .fix b{display:block;color:var(--acc);font-weight:500;font-size:14px}
.stat p{margin:0 0 10px}.stat a{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;font-size:15px}
.audit{margin-top:28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#101113;color:#ecedef;border-radius:14px;padding:24px}
.audit h3{margin-bottom:6px}.audit p{margin:0;color:#a3a7ae;max-width:62ch}
</style>
</head>
